<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Salterra Lobby Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
  --purple: #6A3DF0;
  --blue: #1E73D8;
  --charcoal: #111417;
  --lightbg: #F4F4F2;
}

body {
  margin: 0;
  font-family: 'Cormorant Garamond', serif;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
  cursor: none;
  transition: background 1.5s ease;
}

.container {
  text-align: center;
  max-width: 65%;
  animation: fadeIn 2s ease;
  position: relative;
  z-index: 2;
}

.header {
  font-family: 'Inter', sans-serif;
  font-size: 18px;
  letter-spacing: 3px;
  margin-bottom: 25px;
}

.quote {
  font-size: 60px;
  line-height: 1.25;
  word-break: break-word;
  max-width: 100%;
}

.accent {
  height: 4px;
  width: 120px;
  margin: 35px auto 0;
  background: var(--purple);
  transition: background 1.5s ease;
}

/* Logo container */
#lobby-logo {
  position: absolute;
  z-index: 3;
  transition: all 1s ease-in-out;
}
#lobby-logo img {
  position: absolute;
  width: 100%;
  height: auto;
  opacity: 0;
  transition: opacity 1s ease-in-out;
}

.logo-horizontal { max-width: 180px; width: auto; }
.logo-vertical { max-width: 140px; width: auto; }

.logo-top-left { top: 40px; left: 60px; }
.logo-top-right { top: 40px; right: 60px; }
.logo-bottom-left { bottom: 60px; left: 60px; }
.logo-bottom-right { bottom: 60px; right: 60px; }

/* Background arrow */
.background-arrow {
  position: absolute;
  width: 1000px;
  opacity: 0.08;
  z-index: 0;
  pointer-events: none;
  transition: opacity 1.5s ease, transform 1s ease;
}
.background-arrow stop { transition: stop-color 1.5s ease; }

.arrow-center { top: 50%; left: 50%; transform: translate(-50%, -50%); }
.arrow-top-right { top: 30%; left: 70%; transform: translate(-50%, -50%); }
.arrow-bottom-left { top: 70%; left: 30%; transform: translate(-50%, -50%); }

.background-arrow svg { width: 100%; height: auto; }

@keyframes fadeIn { from {opacity:0; transform:translateY(15px);} to {opacity:1; transform:translateY(0);} }

</style>
</head>
<body>

<!-- Background arrow -->
<div class="background-arrow arrow-center">
  <svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop id="arrowStop1" offset="0%" stop-color="#6A3DF0"/>
        <stop id="arrowStop2" offset="100%" stop-color="#8C52FF"/>
      </linearGradient>
    </defs>
    <path d="M300 60 L480 200 L300 340"
          stroke="url(#arrowGradient)"
          stroke-width="60"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
  </svg>
</div>

<div class="container">
  <div class="header" id="header"></div>
  <div class="quote" id="quote"></div>
  <div class="accent" id="accent"></div>
</div>

<!-- Logos (local SVG files in same folder) -->
<div id="lobby-logo" class="logo-top-right logo-horizontal">
  <img id="logo-primary-horizontal" src="logo-primary-horizontal.svg" />
  <img id="logo-primary" src="logo-primary.svg" />
  <img id="logo-secondary-horizontal" src="logo-secondary-horizontal.svg" />
  <img id="logo-secondary" src="logo-secondary.svg" />
</div>

<script>
// ================= Quotes =================
const SHEET_URL = "https://opensheet.elk.sh/1vtJmF8v7SnHgM4a-YMVmrozN5aSXeSXCvqA30YepvHk/Content";
let content=[], index=0;

async function fetchSheet(){
  try {
    const res = await fetch(SHEET_URL);
    const data = await res.json();
    content = data.filter(r=>r.Active && r.Active.toLowerCase()==="true")
                  .map(r=>({type:r.Type?.toLowerCase()||"quote", text:r.Text, weight:parseInt(r.Weight)||1}));
    weightedShuffle();
  } catch(e){console.error(e);}
}

function weightedShuffle(){
  let weighted=[];
  content.forEach(item=>{ for(let i=0;i<item.weight;i++) weighted.push(item); });
  content = weighted.sort(()=>0.5-Math.random());
}

function setQuoteText(text){
  const quote=document.getElementById("quote");
  quote.textContent=text;
  let fs=60; quote.style.fontSize=fs+"px";
  while(quote.scrollWidth>quote.parentElement.offsetWidth && fs>24){ fs-=2; quote.style.fontSize=fs+"px"; }
}

function rotateColors(){
  const accent=document.getElementById("accent");
  const stop1=document.getElementById("arrowStop1");
  const stop2=document.getElementById("arrowStop2");
  const isPurple = accent.style.background==="var(--purple)";
  if(isPurple){
    accent.style.background="var(--blue)";
    stop1.setAttribute("stop-color","#1E73D8");
    stop2.setAttribute("stop-color","#4AA3FF");
  } else {
    accent.style.background="var(--purple)";
    stop1.setAttribute("stop-color","#6A3DF0");
    stop2.setAttribute("stop-color","#8C52FF");
  }
}

function rotateQuote(){
  if(!content.length) return;
  const item=content[index];
  setQuoteText(item.text);
  index=(index+1)%content.length;
  rotateColors();
}

// ================= Background & theme =================
function setTheme(){
  const hour=new Date().getHours();
  const isDay = hour>=7 && hour<=18;
  document.body.style.background = isDay ? "var(--lightbg)" : "var(--charcoal)";
  updateLogoForTheme(isDay);
  return isDay;
}

// ================= Logos =================
const logos = {
  primary: { horizontal: document.getElementById("logo-primary-horizontal"), vertical: document.getElementById("logo-primary") },
  secondary: { horizontal: document.getElementById("logo-secondary-horizontal"), vertical: document.getElementById("logo-secondary") }
};

let currentLogoType="primary", currentLogoOrientation="horizontal", currentPositionIndex=0;
const logoContainer=document.getElementById("lobby-logo");
const positions=["logo-top-left","logo-top-right","logo-bottom-right","logo-bottom-left"];

function updateLogoForTheme(isDay){
  currentLogoType=isDay?"primary":"secondary";
  currentLogoOrientation="horizontal"; 
  Object.values(logos).forEach(obj=>Object.values(obj).forEach(img=>img.style.opacity=0));
  logos[currentLogoType][currentLogoOrientation].style.opacity=1;
  logoContainer.classList.remove("logo-horizontal","logo-vertical");
  logoContainer.classList.add("logo-horizontal");
}

// Rotate logo positions
function rotateLogo(){
  logoContainer.classList.remove(positions[currentPositionIndex]);
  currentPositionIndex=(currentPositionIndex+1)%positions.length;
  logoContainer.classList.add(positions[currentPositionIndex]);
}

// ================= Background arrow rotation =================
let arrowRotation=0;
setInterval(()=>{
  arrowRotation+=10;
  const arrow=document.querySelector(".background-arrow");
  arrow.style.transform=`translate(-50%,-50%) rotate(${arrowRotation}deg)`;
},20000);

// ================= Initialize =================
async function init(){
  await fetchSheet();
  rotateQuote();
  setTheme();
  setInterval(rotateQuote,32000);
  setInterval(()=>setTheme(),60000); 
  setInterval(rotateLogo,25000);
}
init();
</script>
</body>
</html>
