<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Salterra Lobby Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --purple:#6A3DF0;
  --blue:#1E73D8;
  --charcoal:#0f1115;
  --lightbg:#F4F4F2;
}

body{
  margin:0;
  font-family:'Cormorant Garamond',serif;
  background:var(--lightbg);
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  overflow:hidden;
  position:relative;
  transition:background 1.5s ease,color 1.5s ease;
}

/* Cinematic intro overlay */
#intro{
  position:fixed;
  inset:0;
  background:var(--charcoal);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  animation:introFade 3s forwards;
}
#intro h1{
  color:white;
  font-family:'Inter',sans-serif;
  font-size:48px;
  letter-spacing:4px;
  animation:introText 2.5s ease forwards;
}
@keyframes introFade{
  0%{opacity:1;}
  85%{opacity:1;}
  100%{opacity:0;visibility:hidden;}
}
@keyframes introText{
  0%{opacity:0;transform:scale(.9);}
  100%{opacity:1;transform:scale(1);}
}

/* Ambient gradient atmosphere */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 30% 30%, rgba(106,61,240,.08), transparent 60%),
    radial-gradient(circle at 70% 70%, rgba(30,115,216,.08), transparent 60%);
  pointer-events:none;
  z-index:0;
  transition:opacity 2s ease;
}

/* Arrow */
.background-arrow{
  position:absolute;
  width:1100px;
  opacity:.08;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  animation:spin 140s linear infinite;
  transition:opacity 1.5s ease;
}
@keyframes spin{
  from{transform:translate(-50%,-50%) rotate(0deg);}
  to{transform:translate(-50%,-50%) rotate(360deg);}
}

/* Text container */
.container{
  position:relative;
  z-index:10;
  text-align:center;
  max-width:65%;
  padding:60px;
  margin-top:40px;
}

.quote{
  font-size:72px;
  line-height:1.15;
  font-weight:600;
  letter-spacing:-1px;
  max-height:60vh;
  overflow:hidden;
  transition:opacity .8s ease, transform .8s ease;
}

.accent{
  height:6px;
  width:200px;
  margin:60px auto 0;
  border-radius:4px;
  transition:background 1.2s ease, box-shadow 1.2s ease;
}

/* Logo */
#logo-container{
  position:absolute;
  z-index:20;
  transition:all 1s ease;
}
#logo-container img{
  max-width:260px;
  max-height:120px;
  width:auto;
  height:auto;
  transition:opacity .6s ease, transform 1.2s ease;
}
.logo-hidden{opacity:0;}

/* Logo positions */
.top-left{top:40px;left:60px;}
.top-right{top:40px;right:60px;}
.bottom-left{bottom:60px;left:60px;}
.bottom-right{bottom:60px;right:60px;}
</style>
</head>
<body>

<div id="intro">
  <h1>SALTERRA</h1>
</div>

<!-- Arrow -->
<div class="background-arrow">
<svg viewBox="0 0 600 400">
<defs>
<linearGradient id="arrowGradient">
<stop id="stop1" offset="0%" stop-color="#6A3DF0"/>
<stop id="stop2" offset="100%" stop-color="#8C52FF"/>
</linearGradient>
</defs>
<path d="M300 60 L480 200 L300 340"
stroke="url(#arrowGradient)"
stroke-width="60"
stroke-linecap="round"
stroke-linejoin="round"
fill="none"/>
</svg>
</div>

<!-- Text -->
<div class="container">
  <div id="quote" class="quote"></div>
  <div id="accent" class="accent"></div>
</div>

<!-- Logo -->
<div id="logo-container" class="top-right">
<img id="logo" src="logo-primary-horizontal.png">
</div>

<script>
const SHEET_URL="https://opensheet.elk.sh/1vtJmF8v7SnHgM4a-YMVmrozN5aSXeSXCvqA30YepvHk/Content";

let slides=[];
let index=0;

async function fetchSlides(){
  try{
    const res=await fetch(SHEET_URL);
    const data=await res.json();

    let weighted=[];
    data.forEach(r=>{
      const active=(r.Active||"").toLowerCase().trim();
      if(active==="true"||active==="yes"||active==="1"){
        const weight=parseInt(r.Weight)||1;
        for(let i=0;i<weight;i++){
          weighted.push((r.Text||"").trim());
        }
      }
    });

    slides=weighted.filter(t=>t.length>0);

    if(!slides.length) throw "No slides";

  }catch(e){
    console.error(e);
    slides=[
      "Vision shapes reality.",
      "Bold strategy creates clarity.",
      "Design with intention."
    ];
  }
}

function setQuote(text){
  const q=document.getElementById("quote");
  q.style.opacity=0;
  q.style.transform="translateY(20px)";
  setTimeout(()=>{
    q.textContent=text;
    autoScaleText();
    q.style.opacity=1;
    q.style.transform="translateY(0)";
  },400);
}

function autoScaleText(){
  const q=document.getElementById("quote");
  let size=72;
  q.style.fontSize=size+"px";
  while((q.scrollHeight>window.innerHeight*0.6||q.scrollWidth>q.parentElement.offsetWidth) && size>28){
    size-=2;
    q.style.fontSize=size+"px";
  }
}

function updateSlide(){
  const theme=index%2===0?"purple":"blue";
  const accent=document.getElementById("accent");
  const stop1=document.getElementById("stop1");
  const stop2=document.getElementById("stop2");
  const logo=document.getElementById("logo");

  if(theme==="blue"){
    accent.style.background="var(--blue)";
    accent.style.boxShadow="0 0 30px rgba(30,115,216,.4)";
    stop1.setAttribute("stop-color","#1E73D8");
    stop2.setAttribute("stop-color","#4AA3FF");
    logo.src=index%4<2?
      "logo-secondary-horizontal.png":
      "logo-secondary.png";
  }else{
    accent.style.background="var(--purple)";
    accent.style.boxShadow="0 0 30px rgba(106,61,240,.4)";
    stop1.setAttribute("stop-color","#6A3DF0");
    stop2.setAttribute("stop-color","#8C52FF");
    logo.src=index%4<2?
      "logo-primary-horizontal.png":
      "logo-primary.png";
  }

  setQuote(slides[index%slides.length]);

  index++;
}

/* Parallax drift */
document.addEventListener("mousemove",e=>{
  const arrow=document.querySelector(".background-arrow");
  const x=(e.clientX/window.innerWidth-.5)*20;
  const y=(e.clientY/window.innerHeight-.5)*20;
  arrow.style.marginLeft=x+"px";
  arrow.style.marginTop=y+"px";
});

/* Ambient float */
setInterval(()=>{
  const arrow=document.querySelector(".background-arrow");
  arrow.style.marginLeft=(Math.random()*10-5)+"px";
  arrow.style.marginTop=(Math.random()*10-5)+"px";
},6000);

/* Logo position sync */
const positions=["top-right","bottom-right","bottom-left","top-left"];
let posIndex=0;
function rotateLogoPosition(){
  const container=document.getElementById("logo-container");
  container.className=positions[posIndex];
  posIndex=(posIndex+1)%positions.length;
}

async function init(){
  await fetchSlides();
  updateSlide();
  rotateLogoPosition();
  setInterval(()=>{
    updateSlide();
    rotateLogoPosition();
  },30000);
}

init();
</script>
</body>
</html>
