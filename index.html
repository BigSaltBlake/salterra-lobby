<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Salterra Lobby Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
  --purple: #6A3DF0;
  --blue: #1E73D8;
  --charcoal: #111417;
  --lightbg: #F4F4F2;
}

body {
  margin: 0;
  font-family: 'Cormorant Garamond', serif;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  transition: background 2s ease;
  overflow: hidden;
  cursor: none;
}

.container {
  text-align: center;
  max-width: 65%;
  animation: fadeIn 2s ease;
}

.header {
  font-family: 'Inter', sans-serif;
  font-size: 18px;
  letter-spacing: 3px;
  margin-bottom: 25px;
}

.quote {
  font-size: 60px;
  line-height: 1.25;
}

.accent {
  height: 4px;
  width: 120px;
  margin: 35px auto 0;
  background: var(--purple);
  transition: background 1s ease;
}

.arrow {
  position: absolute;
  bottom: 40px;
  right: 60px;
  font-size: 80px;
  opacity: 0.05;
  font-family: 'Inter', sans-serif;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
#lobby-logo {
  position: absolute;
  width: 220px;
  transition: all 1.5s ease-in-out;
}

.logo-top-left {
  top: 40px;
  left: 60px;
}

.logo-top-right {
  top: 40px;
  right: 60px;
}

.logo-bottom-left {
  bottom: 60px;
  left: 60px;
}

.logo-bottom-right {
  bottom: 60px;
  right: 60px;
}

#lobby-logo img {
  width: 100%;
  transition: opacity 1.5s ease-in-out;
}

.logo-hidden {
  opacity: 0;
}
.brand-arrow {
  position: absolute;
  bottom: 60px;
  right: 80px;
  width: 220px;
  opacity: 0.08;
  transition: opacity 2s ease, transform 8s ease-in-out;
}

.brand-arrow svg {
  width: 100%;
  height: auto;
}

.brand-arrow:hover {
  opacity: 0.15;
}
.background-arrow {
  position: absolute;
  width: 1000px;
  opacity: 0.07;
  z-index: 0;
  pointer-events: none;
  transition: transform 20s linear, top 3s ease, left 3s ease;
}

.arrow-center {
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.arrow-top-right {
  top: 30%;
  left: 70%;
  transform: translate(-50%, -50%);
}

.arrow-bottom-left {
  top: 70%;
  left: 30%;
  transform: translate(-50%, -50%);
}

.background-arrow svg {
  width: 100%;
  height: auto;
}

.container {
  position: relative;
  z-index: 2;
}

.background-arrow svg {
  width: 100%;
  height: auto;
}

.container {
  position: relative;
  z-index: 2;
}
  
</style>
</head>

<body>
<div class="background-arrow arrow-center">

<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
   <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop id="arrowStop1" offset="0%" stop-color="#6A3DF0"/>
  <stop id="arrowStop2" offset="100%" stop-color="#8C52FF"/>
</linearGradient>

      <stop offset="0%" stop-color="#6A3DF0"/>
      <stop offset="100%" stop-color="#8C52FF"/>
    </linearGradient>
  </defs>
<path d="M300 60 L480 200 L300 340"
      stroke="url(#arrowGradient)"
      stroke-width="60"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"/>



</svg>
</div>

<div class="container">
  <div class="header" id="header"></div>
  <div class="quote" id="quote"></div>
  <div class="accent" id="accent"></div>
</div>
  
<div id="lobby-logo">
  <img id="rotating-logo" src="logo-primary-horizontal.png" />
</div>

<script>
const SHEET_ID = "1vtJmF8v7SnHgM4a-YMVmrozN5aSXeSXCvqA30YepvHk";
const SHEET_NAME = "Content";
const SHEET_URL = `https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME}`;

let content = [];
let index = 0;

async function fetchSheet() {
  try {
    const response = await fetch(SHEET_URL);
    const data = await response.json();

    content = data
      .filter(row => row.Active && row.Active.toLowerCase() === "true")
      .map(row => ({
        type: row.Type?.toLowerCase(),
        text: row.Text,
        weight: parseInt(row.Weight) || 1
      }));

    weightedShuffle();
  } catch (error) {
    console.error("Sheet load failed:", error);
  }
}

function weightedShuffle() {
  let weighted = [];
  content.forEach(item => {
    for (let i = 0; i < item.weight; i++) {
      weighted.push(item);
    }
  });
  content = weighted.sort(() => 0.5 - Math.random());
}

function setTheme() {
  const hour = new Date().getHours();
  if(hour >= 7 && hour <= 18){
    document.body.style.background = "var(--lightbg)";
    document.body.style.color = "#1A1F24";
  } else {
    document.body.style.background = "var(--charcoal)";
    document.body.style.color = "#FFFFFF";
  }
}

function rotate() {
  if(content.length === 0) return;

  setTheme();
  const item = content[index];
  const header = document.getElementById("header");
  const quote = document.getElementById("quote");
  const accent = document.getElementById("accent");
const arrowStop1 = document.getElementById("arrowStop1");
const arrowStop2 = document.getElementById("arrowStop2");
const arrow = document.querySelector(".background-arrow");

  header.textContent = "";
  header.style.color = "var(--purple)";
  accent.style.background = "var(--purple)";

if(item.type === "tax"){
  header.textContent = "TAX REMINDER";
  arrowStop1.setAttribute("stop-color", "#6A3DF0");
  arrowStop2.setAttribute("stop-color", "#8C52FF");
  arrow.className = "background-arrow arrow-top-right";
}

if(item.type === "appreciation"){
  accent.style.background = "var(--blue)";
  arrowStop1.setAttribute("stop-color", "#1E73D8");
  arrowStop2.setAttribute("stop-color", "#4AA3FF");
  arrow.className = "background-arrow arrow-bottom-left";
}

if(item.type === "strategy"){
  header.textContent = "STRATEGIC NOTE";
  header.style.color = "var(--blue)";
  arrowStop1.setAttribute("stop-color", "#1E73D8");
  arrowStop2.setAttribute("stop-color", "#4AA3FF");
  arrow.className = "background-arrow arrow-center";
}

  if(item.type === "brand"){
    header.textContent = "";
    quote.textContent = "Salterra CFO";
    accent.style.background = "var(--purple)";
    index = (index + 1) % content.length;
    return;
  }

  quote.textContent = item.text;
  index = (index + 1) % content.length;
}

async function init() {
  await fetchSheet();
  rotate();
  setInterval(rotate, 75000);
}

init();
// ===== Logo Rotation =====

const logos = [
  "logo-primary-horizontal.png",
  "logo-primary.png",
  "logo-secondary-horizontal.png",
  "logo-secondary.png"
];

const positions = [
  "logo-top-left",
  "logo-top-right",
  "logo-bottom-right",
  "logo-bottom-left"
];

let currentLogoIndex = 0;
let currentPositionIndex = 0;

function rotateLogo() {
  const logoImg = document.getElementById("rotating-logo");
  const logoContainer = document.getElementById("lobby-logo");

  logoImg.classList.add("logo-hidden");

  setTimeout(() => {
    currentLogoIndex = (currentLogoIndex + 1) % logos.length;
    logoImg.src = logos[currentLogoIndex];

    logoContainer.classList.remove(positions[currentPositionIndex]);
    currentPositionIndex = (currentPositionIndex + 1) % positions.length;
    logoContainer.classList.add(positions[currentPositionIndex]);

    logoImg.classList.remove("logo-hidden");
  }, 1500);
}

// Set initial position
document.getElementById("lobby-logo").classList.add("logo-top-right");

setInterval(rotateLogo, 25000);
// ===== Background Arrow Animation =====

let arrowRotation = 0;

setInterval(() => {
  arrowRotation += 10;
  const arrow = document.querySelector(".background-arrow");
  arrow.style.transform =
    `translate(-50%, -50%) rotate(${arrowRotation}deg) scale(${1 + Math.random() * 0.08})`;
}, 20000);
  
</script>


</body>



</html>
