<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Salterra Lobby Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
  --purple: #6A3DF0;
  --blue: #1E73D8;
  --charcoal: #111417;
  --lightbg: #F4F4F2;
}

body {
  margin: 0;
  font-family: 'Cormorant Garamond', serif;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  transition: background 2s ease;
  overflow: hidden;
  cursor: none;
}

.container {
  text-align: center;
  max-width: 65%;
  animation: fadeIn 2s ease;
  position: relative;
  z-index: 2;
}

.header {
  font-family: 'Inter', sans-serif;
  font-size: 18px;
  letter-spacing: 3px;
  margin-bottom: 25px;
}

.quote {
  font-size: 60px;
  line-height: 1.25;
  word-break: break-word;
  max-width: 100%;
}

.accent {
  height: 4px;
  width: 120px;
  margin: 35px auto 0;
  background: var(--purple);
  transition: background 1.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Logo container */
#lobby-logo {
  position: absolute;
  transition: all 1.5s ease-in-out;
}

.logo-horizontal { max-width: 180px; width: auto; }
.logo-vertical { max-width: 140px; width: auto; }

.logo-top-left { top: 40px; left: 60px; }
.logo-top-right { top: 40px; right: 60px; }
.logo-bottom-left { bottom: 60px; left: 60px; }
.logo-bottom-right { bottom: 60px; right: 60px; }

#lobby-logo svg { width: 100%; height: auto; transition: opacity 1s ease-in-out; position: absolute; top:0; left:0; }
.logo-hidden { opacity: 0; }

.background-arrow {
  position: absolute;
  width: 1000px;
  opacity: 0.08;
  z-index: 0;
  pointer-events: none;
  transition: opacity 2s ease, transform 1s ease;
}

.background-arrow stop { transition: stop-color 1.5s ease; }

.arrow-center { top: 50%; left: 50%; transform: translate(-50%, -50%); }
.arrow-top-right { top: 30%; left: 70%; transform: translate(-50%, -50%); }
.arrow-bottom-left { top: 70%; left: 30%; transform: translate(-50%, -50%); }

.background-arrow svg { width: 100%; height: auto; }

@keyframes rotateArrow {
  from { transform: translate(-50%,-50%) rotate(0deg); }
  to { transform: translate(-50%,-50%) rotate(360deg); }
}

.background-arrow { animation: rotateArrow 60s linear infinite; }

</style>
</head>

<body>

<!-- Background arrow -->
<div class="background-arrow arrow-center">
  <svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop id="arrowStop1" offset="0%" stop-color="#6A3DF0"/>
        <stop id="arrowStop2" offset="100%" stop-color="#8C52FF"/>
      </linearGradient>
    </defs>
    <path d="M300 60 L480 200 L300 340"
          stroke="url(#arrowGradient)"
          stroke-width="60"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
  </svg>
</div>

<div class="container">
  <div class="header" id="header"></div>
  <div class="quote" id="quote"></div>
  <div class="accent" id="accent"></div>
</div>

<!-- Inline SVG logos -->
<div id="lobby-logo" class="logo-top-right logo-horizontal">
  <!-- Replace these with your actual SVG logos -->
  <svg id="logo-1" viewBox="0 0 200 60"> ... </svg>
  <svg id="logo-2" viewBox="0 0 100 200"> ... </svg>
  <svg id="logo-3" viewBox="0 0 200 60"> ... </svg>
  <svg id="logo-4" viewBox="0 0 100 200"> ... </svg>
</div>

<script>
// ===== Sheet + Quotes =====
const SHEET_ID="1vtJmF8v7SnHgM4a-YMVmrozN5aSXeSXCvqA30YepvHk";
const SHEET_NAME="Content";
const SHEET_URL=`https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME}`;

let content=[], index=0;

async function fetchSheet(){
  try{
    const res=await fetch(SHEET_URL);
    const data=await res.json();
    content=data.filter(r=>r.Active && r.Active.toLowerCase()==="true")
      .map(r=>({ type:r.Type?.toLowerCase()||"quote", text:r.Text, weight:parseInt(r.Weight)||1 }));
    weightedShuffle();
  }catch(e){console.error(e);}
}

function weightedShuffle(){
  let weighted=[];
  content.forEach(item=>{ for(let i=0;i<item.weight;i++) weighted.push(item); });
  content=weighted.sort(()=>0.5-Math.random());
}

function setTheme(){
  const h=new Date().getHours();
  const isDay=h>=7&&h<=18;
  document.body.style.background=isDay?"var(--lightbg)":"var(--charcoal)";
  document.body.style.color=isDay?"#1A1F24":"#FFFFFF";
}

// Auto scale quotes
function setQuoteText(text){
  const quote=document.getElementById("quote");
  quote.textContent=text;
  let fs=60; quote.style.fontSize=fs+"px";
  while(quote.scrollWidth>quote.parentElement.offsetWidth && fs>24){ fs-=2; quote.style.fontSize=fs+"px"; }
}

// Smooth gradient + accent swap
function rotateColors(){
  const accent=document.getElementById("accent");
  const stop1=document.getElementById("arrowStop1");
  const stop2=document.getElementById("arrowStop2");
  const isPurple=accent.style.background==="var(--purple)";
  if(isPurple){
    accent.style.background="var(--blue)";
    stop1.setAttribute("stop-color","#1E73D8");
    stop2.setAttribute("stop-color","#4AA3FF");
  } else {
    accent.style.background="var(--purple)";
    stop1.setAttribute("stop-color","#6A3DF0");
    stop2.setAttribute("stop-color","#8C52FF");
  }
}

function rotate(){
  if(!content.length) return;
  setTheme();
  const item=content[index];
  const header=document.getElementById("header");
  header.textContent="";
  header.style.color="var(--purple)";
  setQuoteText(item.text);

  const arrow=document.querySelector(".background-arrow");
  if(item.weight>=4){ arrow.style.opacity="0.22"; }
  else if(item.weight>=2){ arrow.style.opacity="0.18"; }
  else{ arrow.style.opacity="0.15"; }

  rotateColors();
  index=(index+1)%content.length;
}

// Init
async function init(){ await fetchSheet(); rotate(); setInterval(rotate,32000); }
init();

// ===== Logo rotation =====
const logoSVGs=[
  document.getElementById("logo-1"),
  document.getElementById("logo-2"),
  document.getElementById("logo-3"),
  document.getElementById("logo-4")
];
const positions=["logo-top-left","logo-top-right","logo-bottom-right","logo-bottom-left"];
let currentLogoIndex=0, currentPositionIndex=0;
const logoContainer=document.getElementById("lobby-logo");

function updateLogo(){
  logoSVGs.forEach((svg,i)=>svg.style.opacity=(i===currentLogoIndex)?1:0);
  logoContainer.classList.remove("logo-horizontal","logo-vertical");
  const viewBox = logoSVGs[currentLogoIndex].getAttribute("viewBox").split(" ");
  const width=parseFloat(viewBox[2]);
  const height=parseFloat(viewBox[3]);
  if(width>=height){ logoContainer.classList.add("logo-horizontal"); }
  else{ logoContainer.classList.add("logo-vertical"); }
}

function rotateLogo(){
  currentLogoIndex=(currentLogoIndex+1)%logoSVGs.length;
  logoContainer.classList.remove(positions[currentPositionIndex]);
  currentPositionIndex=(currentPositionIndex+1)%positions.length;
  logoContainer.classList.add(positions[currentPositionIndex]);
  updateLogo();
}

updateLogo();
setInterval(rotateLogo,25000);

// Optional: continuous gradient swap independently
setInterval(rotateColors,16000);

</script>
</body>
</html>
