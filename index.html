<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Salterra Lobby Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --purple:#6A3DF0;
  --blue:#1E73D8;
  --light:#F4F4F2;
  --dark:#111417;
}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--light);
  color:#1A1F24;
  font-family:'Cormorant Garamond',serif;
  transition:background 2s ease, color 2s ease;
}

/* ===== SAFE CONTENT AREA ===== */
.container{
  width:60%;
  max-width:1100px;
  text-align:center;
  z-index:5;
  position:relative;
  padding:60px 40px;
}

.header{
  font-family:'Inter',sans-serif;
  font-size:18px;
  letter-spacing:3px;
  margin-bottom:35px;
  opacity:.8;
}

.quote{
  font-size:64px;
  line-height:1.25;
  max-height:55vh;
  overflow:hidden;
  transition:opacity .8s ease, transform .8s ease;
}

.quote.fade-out{
  opacity:0;
  transform:translateY(10px);
}

.accent{
  height:4px;
  width:150px;
  margin:45px auto 0;
  transition:background 1.2s ease;
}

/* ===== LOGO ===== */
#logo-container{
  position:absolute;
  z-index:4;
  transition:all 1s ease;
}

#logo-container img{
  max-width:240px;
  max-height:110px;
  width:auto;
  height:auto;
  transition:opacity .6s ease;
}

.logo-top-left{ top:40px; left:60px; }
.logo-top-right{ top:40px; right:60px; }
.logo-bottom-left{ bottom:40px; left:60px; }
.logo-bottom-right{ bottom:40px; right:60px; }

/* ===== BACKGROUND ARROW ===== */
.background-arrow{
  position:absolute;
  width:1100px;
  opacity:0.06;
  z-index:0;
  pointer-events:none;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  animation:spinClockwise 120s linear infinite,
            zoomPulse 20s ease-in-out infinite;
}

.background-arrow svg{ width:100%; }

.background-arrow stop{
  transition:stop-color 1.2s ease;
}

@keyframes spinClockwise{
  from{ transform:translate(-50%,-50%) rotate(0deg); }
  to{ transform:translate(-50%,-50%) rotate(360deg); }
}

@keyframes spinCounter{
  from{ transform:translate(-50%,-50%) rotate(0deg); }
  to{ transform:translate(-50%,-50%) rotate(-360deg); }
}

@keyframes zoomPulse{
  0%{ transform:translate(-50%,-50%) scale(1) rotate(0deg); }
  50%{ transform:translate(-50%,-50%) scale(1.05) rotate(180deg); }
  100%{ transform:translate(-50%,-50%) scale(1) rotate(360deg); }
}
</style>
</head>
<body>

<!-- Background Arrow -->
<div class="background-arrow" id="arrow">
  <svg viewBox="0 0 600 400">
    <defs>
      <linearGradient id="arrowGradient">
        <stop id="stop1" offset="0%" stop-color="#6A3DF0"/>
        <stop id="stop2" offset="100%" stop-color="#8C52FF"/>
      </linearGradient>
    </defs>
    <path d="M300 60 L480 200 L300 340"
          stroke="url(#arrowGradient)"
          stroke-width="70"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
  </svg>
</div>

<!-- Content -->
<div class="container">
  <div class="header">SALTerra</div>
  <div class="quote" id="quote"></div>
  <div class="accent" id="accent"></div>
</div>

<!-- Logo -->
<div id="logo-container" class="logo-top-right">
  <img id="logo-img" src="logo-primary-horizontal.png">
</div>

<script>

/* ===== CONFIG ===== */
const SHEET_URL = "https://opensheet.elk.sh/1vtJmF8v7SnHgM4a-YMVmrozN5aSXeSXCvqA30YepvHk/Content";
const SLIDE_DURATION = 30000;

const logos = {
  purple:"logo-primary-horizontal.png",
  blue:"logo-secondary-horizontal.png"
};

const positions = [
  "logo-top-left",
  "logo-top-right",
  "logo-bottom-right",
  "logo-bottom-left"
];

let slides = [];
let index = 0;
let theme = "purple";

/* ===== GOOGLE SHEET ===== */
async function fetchSlides(){
  try{
    const res = await fetch(SHEET_URL);
    const data = await res.json();
    slides = data
      .filter(r=>r.Active && r.Active.toLowerCase()==="true")
      .map(r=>r.Text);
  }catch(e){
    console.error("Sheet failed. Using fallback.");
    slides = [
      "Welcome to Salterra.",
      "Design with intention.",
      "Strategy creates clarity."
    ];
  }
}

/* ===== NIGHT MODE ===== */
function applyDayNight(){
  const hour = new Date().getHours();
  const night = hour >= 19 || hour < 7;
  if(night){
    document.body.style.background="var(--dark)";
    document.body.style.color="#FFFFFF";
  }else{
    document.body.style.background="var(--light)";
    document.body.style.color="#1A1F24";
  }
}

/* ===== FIT TEXT ===== */
function fitText(){
  const el = document.getElementById("quote");
  let size = 64;
  el.style.fontSize=size+"px";
  while(el.scrollHeight > el.offsetHeight && size>28){
    size-=2;
    el.style.fontSize=size+"px";
  }
}

/* ===== MASTER SLIDE UPDATE ===== */
function updateSlide(){

  const quoteEl=document.getElementById("quote");
  const accent=document.getElementById("accent");
  const stop1=document.getElementById("stop1");
  const stop2=document.getElementById("stop2");
  const logoImg=document.getElementById("logo-img");
  const logoContainer=document.getElementById("logo-container");
  const arrow=document.getElementById("arrow");

  quoteEl.classList.add("fade-out");

  setTimeout(()=>{

    quoteEl.textContent=slides[index];
    fitText();
    quoteEl.classList.remove("fade-out");

    theme = theme==="purple"?"blue":"purple";

    if(theme==="blue"){
      accent.style.background="var(--blue)";
      stop1.setAttribute("stop-color","#1E73D8");
      stop2.setAttribute("stop-color","#4AA3FF");
      arrow.style.animation="spinCounter 120s linear infinite, zoomPulse 20s ease-in-out infinite";
    }else{
      accent.style.background="var(--purple)";
      stop1.setAttribute("stop-color","#6A3DF0");
      stop2.setAttribute("stop-color","#8C52FF");
      arrow.style.animation="spinClockwise 120s linear infinite, zoomPulse 20s ease-in-out infinite";
    }

    logoImg.style.opacity=0;
    setTimeout(()=>{
      logoImg.src=logos[theme];
      logoImg.style.opacity=1;
    },400);

    logoContainer.classList.remove(...positions);
    logoContainer.classList.add(positions[index%positions.length]);

    index=(index+1)%slides.length;

  },800);
}

/* ===== INIT ===== */
async function init(){
  await fetchSlides();
  applyDayNight();
  updateSlide();
  setInterval(updateSlide,SLIDE_DURATION);
}

init();

</script>
</body>
</html>
