<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Salterra Lobby Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
  --purple: #6A3DF0;
  --blue: #1E73D8;
  --charcoal: #111417;
  --lightbg: #F4F4F2;
}

body {
  margin: 0;
  font-family: 'Cormorant Garamond', serif;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  transition: background 2s ease;
  overflow: hidden;
  cursor: none;
}

.container {
  text-align: center;
  max-width: 65%;
  animation: fadeIn 2s ease;
  position: relative;
  z-index: 2;
}

.header {
  font-family: 'Inter', sans-serif;
  font-size: 18px;
  letter-spacing: 3px;
  margin-bottom: 25px;
}

.quote {
  font-size: 60px;
  line-height: 1.25;
  word-break: break-word;
  max-width: 100%;
}

.accent {
  height: 4px;
  width: 120px;
  margin: 35px auto 0;
  background: var(--purple);
  transition: background 1s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

#lobby-logo {
  position: absolute;
  transition: all 1.5s ease-in-out;
}

.logo-horizontal { max-width: 180px; width: auto; }
.logo-vertical { max-width: 140px; width: auto; }

.logo-top-left { top: 40px; left: 60px; }
.logo-top-right { top: 40px; right: 60px; }
.logo-bottom-left { bottom: 60px; left: 60px; }
.logo-bottom-right { bottom: 60px; right: 60px; }

#lobby-logo svg { width: 100%; height: auto; transition: opacity 1.5s ease-in-out; }
.logo-hidden { opacity: 0; }

.background-arrow {
  position: absolute;
  width: 1000px;
  opacity: 0.08;
  z-index: 0;
  pointer-events: none;
  transition: opacity 2s ease, transform 8s ease-in-out, stop-color 1s ease;
}
.background-arrow stop { transition: stop-color 1s ease; }

.arrow-center { top: 50%; left: 50%; transform: translate(-50%, -50%); }
.arrow-top-right { top: 30%; left: 70%; transform: translate(-50%, -50%); }
.arrow-bottom-left { top: 70%; left: 30%; transform: translate(-50%, -50%); }

.background-arrow svg { width: 100%; height: auto; }

</style>
</head>

<body>

<!-- Background arrow -->
<div class="background-arrow arrow-center">
  <svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop id="arrowStop1" offset="0%" stop-color="#6A3DF0"/>
        <stop id="arrowStop2" offset="100%" stop-color="#8C52FF"/>
      </linearGradient>
    </defs>
    <path d="M300 60 L480 200 L300 340"
          stroke="url(#arrowGradient)"
          stroke-width="60"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
  </svg>
</div>

<div class="container">
  <div class="header" id="header"></div>
  <div class="quote" id="quote"></div>
  <div class="accent" id="accent"></div>
</div>
  
<!-- Inline SVG logos -->
<div id="lobby-logo" class="logo-top-right logo-horizontal">
  <!-- SVG 1: primary horizontal -->
  <svg id="logo-1" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
    <rect width="200" height="60" fill="#6A3DF0"/>
    <text x="100" y="38" text-anchor="middle" fill="#fff" font-size="24" font-family="Inter">Logo 1</text>
  </svg>

  <!-- SVG 2: primary vertical -->
  <svg id="logo-2" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg" style="display:none">
    <rect width="100" height="200" fill="#6A3DF0"/>
    <text x="50" y="110" text-anchor="middle" fill="#fff" font-size="24" font-family="Inter">Logo 2</text>
  </svg>

  <!-- SVG 3: secondary horizontal -->
  <svg id="logo-3" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg" style="display:none">
    <rect width="200" height="60" fill="#1E73D8"/>
    <text x="100" y="38" text-anchor="middle" fill="#fff" font-size="24" font-family="Inter">Logo 3</text>
  </svg>

  <!-- SVG 4: secondary vertical -->
  <svg id="logo-4" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg" style="display:none">
    <rect width="100" height="200" fill="#1E73D8"/>
    <text x="50" y="110" text-anchor="middle" fill="#fff" font-size="24" font-family="Inter">Logo 4</text>
  </svg>
</div>

<script>
const SHEET_ID = "1vtJmF8v7SnHgM4a-YMVmrozN5aSXeSXCvqA30YepvHk";
const SHEET_NAME = "Content";
const SHEET_URL = `https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME}`;

let content = [];
let index = 0;

async function fetchSheet() {
  try {
    const response = await fetch(SHEET_URL);
    const data = await response.json();
    content = data
      .filter(row => row.Active && row.Active.toLowerCase() === "true")
      .map(row => ({
        type: row.Type?.toLowerCase() || "quote",
        text: row.Text,
        weight: parseInt(row.Weight) || 1
      }));
    weightedShuffle();
  } catch (error) { console.error("Sheet load failed:", error); }
}

function weightedShuffle() {
  let weighted = [];
  content.forEach(item => {
    for (let i=0;i<item.weight;i++) weighted.push(item);
  });
  content = weighted.sort(() => 0.5 - Math.random());
}

function setTheme() {
  const hour = new Date().getHours();
  const isDay = hour >=7 && hour <=18;
  document.body.style.background = isDay ? "var(--lightbg)" : "var(--charcoal)";
  document.body.style.color = isDay ? "#1A1F24" : "#FFFFFF";
}

function setQuoteText(text){
  const quote = document.getElementById("quote");
  quote.textContent = text;
  let fontSize = 60;
  quote.style.fontSize = fontSize+"px";
  while(quote.scrollWidth > quote.parentElement.offsetWidth && fontSize>24){
    fontSize -= 2;
    quote.style.fontSize = fontSize+"px";
  }
}

function rotateColors(){
  const accent = document.getElementById("accent");
  const stop1 = document.getElementById("arrowStop1");
  const stop2 = document.getElementById("arrowStop2");
  if(accent.style.background==="var(--purple)"){
    accent.style.background="var(--blue)";
    stop1.setAttribute("stop-color","#1E73D8");
    stop2.setAttribute("stop-color","#4AA3FF");
  } else {
    accent.style.background="var(--purple)";
    stop1.setAttribute("stop-color","#6A3DF0");
    stop2.setAttribute("stop-color","#8C52FF");
  }
}

function rotate(){
  if(content.length===0) return;
  setTheme();
  const item = content[index];
  const header = document.getElementById("header");
  header.textContent = "";
  header.style.color = "var(--purple)";
  
  setQuoteText(item.text);

  const arrow = document.querySelector(".background-arrow");
  if(item.weight>=4){ arrow.style.transform="translate(-50%,-50%) scale(1.2)"; arrow.style.opacity="0.22";}
  else if(item.weight>=2){ arrow.style.transform="translate(-50%,-50%) scale(1)"; arrow.style.opacity="0.18";}
  else{ arrow.style.transform="translate(-50%,-50%) scale(0.85)"; arrow.style.opacity="0.15";}

  rotateColors(); // accent line + arrow gradient

  index = (index+1) % content.length;
}

async function init(){
  await fetchSheet();
  rotate();
  setInterval(rotate,32000);
}

init();

// ===== Logo Rotation =====
const logoSVGs = [
  document.getElementById("logo-1"),
  document.getElementById("logo-2"),
  document.getElementById("logo-3"),
  document.getElementById("logo-4")
];
const positions = ["logo-top-left","logo-top-right","logo-bottom-right","logo-bottom-left"];
let currentLogoIndex=0, currentPositionIndex=0;
const logoContainer=document.getElementById("lobby-logo");

function updateLogo(){
  logoSVGs.forEach((svg,i)=> svg.style.display=(i===currentLogoIndex)?"block":"none");
  logoContainer.classList.remove("logo-horizontal","logo-vertical");
  const svgEl=logoSVGs[currentLogoIndex];
  if(svgEl.getAttribute("viewBox").includes("200 60")) logoContainer.classList.add("logo-horizontal");
  else logoContainer.classList.add("logo-vertical");
}

function rotateLogo(){
  currentLogoIndex=(currentLogoIndex+1)%logoSVGs.length;
  logoContainer.classList.remove(positions[currentPositionIndex]);
  currentPositionIndex=(currentPositionIndex+1)%positions.length;
  logoContainer.classList.add(positions[currentPositionIndex]);
  updateLogo();
}

updateLogo();
setInterval(rotateLogo,25000);

// ===== Background Arrow Rotation =====
let arrowRotation=0;
setInterval(()=>{
  arrowRotation+=10;
  const arrow=document.querySelector(".background-arrow");
  const scaleMatch=arrow.style.transform.match(/scale\([0-9.]+\)/);
  const scale=scaleMatch?scaleMatch[0]:"scale(1)";
  arrow.style.transform=`translate(-50%,-50%) rotate(${arrowRotation}deg) ${scale}`;
},20000);

</script>
</body>
</html>
