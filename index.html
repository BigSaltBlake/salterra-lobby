<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Salterra Lobby Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --purple:#6A3DF0;
  --blue:#1E73D8;
  --dark:#111417;
  --light:#F4F4F2;
}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Cormorant Garamond',serif;
  background:var(--light);
  transition:background 1s ease;
}

/* ===== CONTENT SAFE AREA ===== */
.container{
  width:60%;
  max-width:1100px;
  text-align:center;
  z-index:5;
  position:relative;
  padding:40px 20px;
}

.header{
  font-family:'Inter',sans-serif;
  font-size:18px;
  letter-spacing:3px;
  margin-bottom:30px;
}

.quote{
  font-size:64px;
  line-height:1.25;
  word-wrap:break-word;
  overflow-wrap:break-word;
  max-height:55vh;
  overflow:hidden;
}

.accent{
  height:4px;
  width:140px;
  margin:40px auto 0;
  transition:background 1s ease;
}

/* ===== LOGO SAFE ZONE ===== */
#logo-container{
  position:absolute;
  z-index:4;
  transition:all 1s ease;
}

#logo-container img{
  max-width:240px;
  max-height:110px;
  width:auto;
  height:auto;
  display:block;
}

/* LOGO POSITIONS (kept OUTSIDE text zone) */
.logo-top-left{ top:40px; left:60px; }
.logo-top-right{ top:40px; right:60px; }
.logo-bottom-left{ bottom:40px; left:60px; }
.logo-bottom-right{ bottom:40px; right:60px; }

/* ===== BACKGROUND ARROW ===== */
.background-arrow{
  position:absolute;
  width:1100px;
  opacity:0.07;
  z-index:0;
  pointer-events:none;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  transition:transform 2s ease;
}

.background-arrow svg{
  width:100%;
}

.background-arrow stop{
  transition:stop-color 1s ease;
}
</style>
</head>
<body>

<!-- BACKGROUND ARROW -->
<div class="background-arrow" id="arrow">
  <svg viewBox="0 0 600 400">
    <defs>
      <linearGradient id="arrowGradient">
        <stop id="stop1" offset="0%" stop-color="#6A3DF0"/>
        <stop id="stop2" offset="100%" stop-color="#8C52FF"/>
      </linearGradient>
    </defs>
    <path d="M300 60 L480 200 L300 340"
          stroke="url(#arrowGradient)"
          stroke-width="70"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
  </svg>
</div>

<!-- CONTENT -->
<div class="container">
  <div class="header">STRATEGY</div>
  <div class="quote" id="quote"></div>
  <div class="accent" id="accent"></div>
</div>

<!-- LOGO -->
<div id="logo-container" class="logo-top-right">
  <img id="logo-img" src="logo-primary-horizontal.png">
</div>

<script>

/* ===== CONFIG ===== */

const logos = {
  purple: "logo-primary-horizontal.png",
  blue: "logo-secondary-horizontal.png"
};

const positions = [
  "logo-top-left",
  "logo-top-right",
  "logo-bottom-right",
  "logo-bottom-left"
];

let slideIndex = 0;
let theme = "purple";

/* ===== QUOTES ===== */

const quotes = [
  "Welcome to Salterra.",
  "Design with intention.",
  "Strategy creates clarity.",
  "Build with purpose."
];

function fitText(){
  const q = document.getElementById("quote");
  let size = 64;
  q.style.fontSize = size + "px";

  while(q.scrollHeight > q.offsetHeight && size > 28){
    size -= 2;
    q.style.fontSize = size + "px";
  }
}

function updateSlide(){

  /* ===== TEXT ===== */
  document.getElementById("quote").textContent = quotes[slideIndex];
  fitText();

  /* ===== THEME SWITCH ===== */
  theme = theme === "purple" ? "blue" : "purple";

  const accent = document.getElementById("accent");
  const stop1 = document.getElementById("stop1");
  const stop2 = document.getElementById("stop2");
  const logoImg = document.getElementById("logo-img");

  if(theme === "blue"){
    accent.style.background = "var(--blue)";
    stop1.setAttribute("stop-color","#1E73D8");
    stop2.setAttribute("stop-color","#4AA3FF");
    logoImg.src = logos.blue;
  } else {
    accent.style.background = "var(--purple)";
    stop1.setAttribute("stop-color","#6A3DF0");
    stop2.setAttribute("stop-color","#8C52FF");
    logoImg.src = logos.purple;
  }

  /* ===== LOGO POSITION ROTATION ===== */
  const logoContainer = document.getElementById("logo-container");
  logoContainer.classList.remove(...positions);
  logoContainer.classList.add(positions[slideIndex % positions.length]);

  /* ===== ARROW ROTATION ===== */
  const arrow = document.getElementById("arrow");
  arrow.style.transform =
    `translate(-50%,-50%) rotate(${slideIndex * 90}deg)`;

  slideIndex++;
}

/* ===== INITIALIZE ===== */

updateSlide();
setInterval(updateSlide, 30000); // ALL elements sync every 30 seconds

</script>

</body>
</html>
